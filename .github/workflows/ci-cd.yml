name: CI / Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # 1. Backend: Cache, Build y Test en release rápido
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend
        run: dotnet restore

      - name: Run Backend Tests
        run: dotnet test --no-restore -c Release --verbosity normal

      # 2. Frontend: Cache global de npm en subdirectorio
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Build Frontend Fast
        working-directory: ./client
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      # 3. Base de Datos y Stress Test
      - name: Seed Database
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d booking_db -f schema.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d booking_db -f seed.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d booking_db -c "INSERT INTO users (id, email, password_hash) SELECT g, 'stress_' || g || '@test.com', 'pwd' FROM generate_series(1, 500) g ON CONFLICT (id) DO NOTHING;"

      - name: Run API in background
        env:
          DB_CONNECTION_STRING: "Host=localhost;Port=5432;Database=booking_db;Username=postgres;Password=postgrespassword;Maximum Pool Size=300;Timeout=60;Command Timeout=60;"
          JWT_SECRET: "super_secret_evaluation_key_1234567890_min32chars"
          JWT_SECRET_KEY: "super_secret_evaluation_key_1234567890_min32chars"
          ASPNETCORE_HTTP_PORTS: "5000"
        run: |
          dotnet run --project src/Api -c Release --no-build --urls "http://localhost:5000" &
          sleep 4

      - name: Run Concurrency Stress Test
        run: node stress.js --session=42 --concurrency=200
